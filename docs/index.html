<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcriby</title>
<style>
  :root { --bg:#f6f7fb; --card:#fff; --text:#1d2030; --muted:#6b7085; --accent:#5b4bff; --border:#e2e4ee; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#12131a; --card:#1c1e28; --text:#eceef6; --muted:#9a9fb5; --accent:#8a7dff; --border:#2c2f3d; --err:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:680px; margin:0 auto; padding:40px 16px; }
  h1 { margin:0 0 4px; font-size:28px; }
  p.sub { margin:0 0 28px; color:var(--muted); }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:24px; }
  #drop { border:2px dashed var(--border); border-radius:12px; padding:36px 16px; text-align:center; cursor:pointer; transition:.15s; }
  #drop.over, #drop:hover { border-color:var(--accent); }
  #drop strong { display:block; margin-bottom:6px; word-break:break-all; }
  #drop span { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:12px; margin-top:18px; flex-wrap:wrap; align-items:center; }
  label { font-size:14px; color:var(--muted); }
  select, button { font:inherit; padding:10px 14px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); }
  button.primary { background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; flex:1; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .bar { height:8px; background:var(--border); border-radius:6px; overflow:hidden; margin-top:20px; }
  .bar div { height:100%; width:0; background:var(--accent); transition:width .4s; }
  #msg { margin-top:10px; font-size:14px; color:var(--muted); min-height:20px; }
  #msg.err { color:var(--err); }
  #result { display:none; margin-top:20px; }
  #preview { white-space:pre-wrap; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:14px; max-height:260px; overflow:auto; font-size:14px; line-height:1.55; }
  .dl { display:flex; gap:12px; margin-top:14px; flex-wrap:wrap; }
  .dl a { flex:1; text-align:center; text-decoration:none; padding:12px; border-radius:10px; background:var(--accent); color:#fff; font-weight:600; }
  .dl a.alt { background:transparent; color:var(--accent); border:1px solid var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Transcriby</h1>
  <p class="sub">Envie um áudio ou vídeo e receba a legenda em SRT, pronta para levar para uma IA. Grátis: tudo roda no seu navegador e o arquivo não sai do seu computador.</p>
  <div class="card">
    <div id="drop">
      <strong id="fname">Clique ou arraste seu arquivo aqui</strong>
      <span>MP3, WAV, M4A, OGG, MP4, MOV, WEBM…</span>
    </div>
    <input type="file" id="file" accept="audio/*,video/*" hidden>
    <div class="row">
      <label for="lang">Idioma</label>
      <select id="lang">
        <option value="portuguese" selected>Português</option>
        <option value="">Detectar automaticamente</option>
        <option value="english">Inglês</option>
        <option value="spanish">Espanhol</option>
      </select>
      <label for="model">Qualidade</label>
      <select id="model">
        <option value="melhor" selected>Melhor (mais lento)</option>
        <option value="rapido">Rápida</option>
      </select>
    </div>
    <div class="row">
      <label for="style">Estilo</label>
      <select id="style">
        <option value="capcut" selected>Estilo CapCut (curto, sem pontuação)</option>
        <option value="completo">Completo (com pontuação)</option>
      </select>
      <button class="primary" id="go" disabled>Transcrever</button>
    </div>
    <div class="bar"><div id="fill"></div></div>
    <div id="msg" role="status"></div>
    <div id="result">
      <div id="preview"></div>
      <div class="dl">
        <a id="dl-srt" href="#">Baixar SRT</a>
        <a id="dl-txt" class="alt" href="#">Baixar TXT (só o texto)</a>
      </div>
    </div>
  </div>
</main>
<script type="module">
import { toSrt, toTxt } from "./srt.js";
import { decodeToMono16k } from "./audio.js";
const $ = id => document.getElementById(id);
const GO = 'Transcrever', RETRY = 'Tentar de novo';
let file = null, worker = null, urls = [];
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform));
// No celular o modelo "Melhor" pode estourar a memória e o navegador fecha a aba sozinho.
if (isMobile) $('model').value = 'rapido';

// Anota em que etapa a página está. Se o navegador fechar a aba, ao reabrir dá para dizer onde foi.
const KEY = 'transcriby_etapa';
let lastEtapa = '';
const mark = etapa => {
  if (etapa === lastEtapa) return; lastEtapa = etapa;
  try { localStorage.setItem(KEY, JSON.stringify({ etapa, t: Date.now(), mb: file ? Math.round(file.size / 1048576) : 0, modelo: $('model').value })); } catch (_) {}
};
const unmark = () => { lastEtapa = ''; try { localStorage.removeItem(KEY); } catch (_) {} };
try {
  const last = JSON.parse(localStorage.getItem(KEY) || 'null');
  if (last && Date.now() - last.t < 30 * 60 * 1000) {
    $('msg').textContent = `A página fechou sozinha durante: "${last.etapa}" (arquivo de ${last.mb} MB, qualidade ${last.modelo}). É falta de memória do celular. Use a qualidade "Rápida" ou envie só o áudio (M4A ou MP3).`;
    $('msg').classList.add('err');
  }
  localStorage.removeItem(KEY);
} catch (_) {}

const setP = (p, m) => { $('fill').style.width = p + '%'; $('msg').textContent = m; $('msg').classList.remove('err'); };
// Em caso de erro o arquivo continua escolhido: é só apertar "Tentar de novo".
const fail = m => { unmark(); $('msg').textContent = m; $('msg').classList.add('err'); $('go').disabled = false; $('go').textContent = RETRY; };

const pick = f => {
  file = f; $('fname').textContent = f.name;
  $('go').disabled = false; $('go').textContent = GO;
  $('result').style.display = 'none'; setP(0, '');
};
$('drop').onclick = () => $('file').click();
$('file').onchange = e => e.target.files[0] && pick(e.target.files[0]);
['dragover','dragenter'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(ev => $('drop').addEventListener(ev, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => e.dataTransfer.files[0] && pick(e.dataTransfer.files[0]));

function show(segments, style, name) {
  const srt = toSrt(segments, style), txt = toTxt(segments, style);
  urls.forEach(URL.revokeObjectURL); urls = [];
  const link = (id, content, ext) => {
    const u = URL.createObjectURL(new Blob([content], { type: 'text/plain;charset=utf-8' }));
    urls.push(u); $(id).href = u; $(id).download = name + '.' + ext;
  };
  link('dl-srt', srt, 'srt'); link('dl-txt', txt, 'txt');
  $('preview').textContent = srt.slice(0, 3000);
  $('result').style.display = 'block';
}

$('go').onclick = async () => {
  $('go').disabled = true; $('go').textContent = GO; $('result').style.display = 'none';
  try {
    setP(1, 'Lendo o áudio do arquivo…'); mark('lendo o áudio do arquivo');
    const audio = await decodeToMono16k(file, f => setP(1 + Math.round(f * 8), `Lendo o áudio do arquivo… ${Math.round(f * 100)}%`));
    if (worker) worker.terminate();
    worker = new Worker('./worker.js', { type: 'module' });
    const style = $('style').value, name = file.name.replace(/\.[^.]+$/, '') || 'transcricao';
    worker.onmessage = ({ data }) => {
      if (data.type === 'status') { setP(data.pct, data.msg); mark(data.msg.replace(/\s*\d+%/g, '').replace(/…+$/, '')); }
      else if (data.type === 'done') {
        unmark(); $('go').disabled = false;
        if (!data.segments.length) return setP(0, 'Nenhuma fala foi encontrada no arquivo.');
        setP(100, 'Pronto!'); show(data.segments, style, name);
      } else if (data.type === 'error') fail('Erro ao transcrever: ' + data.msg);
    };
    worker.onerror = () => fail('Não consegui carregar o transcritor. Verifique a internet e tente de novo.');
    worker.postMessage({ audio, language: $('lang').value, model: $('model').value, mobile: isMobile }, [audio.buffer]);
  } catch (e) {
    fail('Não consegui ler esse arquivo (' + (e.message || e) + '). Seu arquivo continua escolhido: aperte "Tentar de novo" ou escolha outro.');
  }
};
</script>
</body>
</html>
