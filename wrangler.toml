# Usado pela Cloudflare ao puxar este repositório: publica o Worker do Gemini (cloudflare/worker.js).
name = "transcriby-gemini"
main = "cloudflare/worker.js"
compatibility_date = "2025-01-01"
# Mantém as variáveis criadas no painel da Cloudflare (senha, chaves) quando o código é publicado de novo.
keep_vars = true

# Alerta e freio do chat do Reo (ver cloudflare/LEIA-ME.md, passo "Alerta no Telegram").
# KV criado no painel da Cloudflare em 03/11/2026 (o ID não é segredo).
[[kv_namespaces]]
binding = "ABUSE_KV"
id = "b1d4570b7950484898fc3adebe9a17a0"

# Contador do limite diário de uso (cloudflare/limits.js). Durable Object com SQLite, disponível no plano grátis.
# Não precisa criar nada no painel: a Cloudflare cria na primeira publicação.
[[durable_objects.bindings]]
name = "USAGE"
class_name = "UsageCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageCounter"]

# Enable isolated previews for pull requests.
[previews]
